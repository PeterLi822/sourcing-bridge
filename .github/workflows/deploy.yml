# Auto-deploy SourcingBridge to Firebase Hosting on push to main.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — service-account JSON key for Firebase project "sourcing-bridge"
# The service account needs the "Firebase Hosting Admin" role on the project.

name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Deploy to Firebase Hosting (sourcing-bridge)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sourcing-bridge
          channelId: live
